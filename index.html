<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      (function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          root.dataset.theme = localStorage.getItem('ofa-theme') === 'light' ? 'light' : 'dark'
        } catch (e) {
          root.dataset.theme = 'dark'
        }
        setTimeout(function () {
          var bar = document.getElementById('boot-bar')
          if (bar) bar.remove()
          var shell = document.getElementById('prerender-shell')
          if (shell) shell.setAttribute('data-stuck', '1')
        }, 10000)
      })()
    </script>


    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "One ForAll",
      "alternateName": ["One ForAll", "oneforall.io.vn"],
      "url": "https://oneforall.io.vn/"
    }
    </script>


    <link
      rel="icon"
      type="image/svg+xml"
      href="/oneforall.svg"
    />


    <link
      rel="canonical"
      href="https://oneforall.io.vn/"
    />
    <title>One ForAll - Công Cụ Trực Tuyến</title>

    <meta
      name="description"
      content="One ForAll cung cấp công cụ trực tuyến giúp bạn tải media từ liên kết được hỗ trợ, chuyển đổi định dạng tệp và xử lý hình ảnh."
    />

    <meta name="application-name" content="One ForAll" />

    <meta name="theme-color" content="#0a0a0f" />


    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="One ForAll"
    />

    <meta
      property="og:url"
      content="https://oneforall.io.vn/"
    />

    <meta
      property="og:title"
      content="One ForAll - Công Cụ Trực Tuyến"
    />

    <meta
      property="og:description"
      content="One ForAll cung cấp công cụ trực tuyến giúp bạn tải media từ liên kết được hỗ trợ, chuyển đổi định dạng tệp và xử lý hình ảnh."
    />


    <meta

      content="https://oneforall.io.vn/ogimage.webp"

    />

    />

  </head>

  <body>



    <div id="boot-bar" aria-hidden="true"></div>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
