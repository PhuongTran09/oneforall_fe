<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      (function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          root.dataset.theme = localStorage.getItem('ofa-theme') === 'light' ? 'light' : 'dark'
        } catch (e) {
          root.dataset.theme = 'dark'
        }
        setTimeout(function () {
          var loader = document.getElementById('boot-loader')
          if (!loader) return
          loader.remove()
          root.classList.remove('js')
        }, 10000)
      })()
    </script>
    <style>
      .js .prerendered-content{display:none}
      #boot-loader{--bl-bg:#0a0a0f;--bl-surface:#14141b;--bl-elev:#1a1a24;--bl-grad-1:#ff3b30;--bl-grad-3:#ff8a65;position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;background:var(--bl-bg)}
      html[data-theme='light'] #boot-loader{--bl-bg:#f3f4f9;--bl-surface:#ffffff;--bl-elev:#e9ebf4;--bl-grad-1:#cf2216;--bl-grad-3:#c8571d}
      #boot-loader img{width:64px;height:64px;animation:bl-pulse 1.4s ease-in-out infinite}
      #boot-loader .bl-lines{width:min(320px,80%);display:flex;flex-direction:column;gap:10px}
      #boot-loader .bl-lines i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bl-surface) 25%,var(--bl-elev) 37%,var(--bl-surface) 63%);background-size:400% 100%;animation:bl-shimmer 1.4s ease-in-out infinite}
      #boot-loader .bl-lines i:nth-child(2){width:78%}
      #boot-loader .bl-lines i:nth-child(3){width:52%}
      #boot-loader .bl-track{width:min(200px,60%);height:3px;border-radius:999px;background:var(--bl-surface);overflow:hidden}
      #boot-loader .bl-track b{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,var(--bl-grad-1),var(--bl-grad-3));animation:bl-slide 1.2s ease-in-out infinite}
      @keyframes bl-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.93)}}
      @keyframes bl-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
      @keyframes bl-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#boot-loader *{animation:none}}
    </style>

    <!-- SEO: Website identity -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "One ForAll",
      "alternateName": ["One ForAll", "oneforall.io.vn"],
      "url": "https://oneforall.io.vn/"
    }
    </script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/oneforall.svg"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://oneforall.io.vn/"
    />
    <title>One ForAll - Công Cụ Trực Tuyến</title>

    <meta
      name="description"

    />

    <meta name="application-name" content="One ForAll" />

    <meta name="theme-color" content="#0a0a0f" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta

    />

    <meta

      content="https://oneforall.io.vn/"
    />

    <meta
      property="og:title"
      content="One ForAll - Công Cụ Trực Tuyến"
    />

    <meta
      property="og:description"
      content="One ForAll cung cấp công cụ trực tuyến giúp bạn tải media từ liên kết được hỗ trợ, chuyển đổi định dạng tệp và xử lý hình ảnh."
    />


    <meta

    />

    />

    />

  </head>

  <body>
    <div id="boot-loader" aria-hidden="true">
      <img src="/oneforall.svg" alt="" width="64" height="64" />
      <div class="bl-lines"><i></i><i></i><i></i></div>
      <div class="bl-track"><b></b></div>
